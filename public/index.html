<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog | Kios Dua Putra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <nav class="sticky top-0 z-50 bg-blue-600 shadow-md p-4">
        <div class="container mx-auto flex justify-center items-center text-white">
            <div class="flex items-center space-x-2">
                <i class="fas fa-store text-xl"></i>
                <h1 class="font-extrabold text-lg leading-none uppercase tracking-tighter">KIOS DUA PUTRA</h1>
            </div>
        </div>
    </nav>

    <header class="bg-blue-600 pb-20 pt-6 px-4 rounded-b-[40px] text-white">
        <div class="container mx-auto">
            <h2 class="text-2xl font-bold">Katalog Stok Real-Time</h2>
            <p class="text-blue-100 text-sm opacity-80 mt-1">Data sinkron otomatis tanpa perlu refresh halaman.</p>
        </div>
    </header>

    <main class="container mx-auto px-4 -mt-14">
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" onkeyup="renderKatalog()" 
                placeholder="Cari barang (Mie, Rokok, dll)..." 
                class="w-full p-4 pl-12 rounded-2xl border-none shadow-xl focus:ring-4 focus:ring-blue-500/20 text-lg outline-none transition-all">
        </div>

        <div id="categoryList" class="flex space-x-2 overflow-x-auto pb-4 no-scrollbar"></div>

        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="animate-pulse bg-gray-200 h-40 rounded-2xl"></div>
            <div class="animate-pulse bg-gray-200 h-40 rounded-2xl"></div>
        </div>
    </main>

    <script>
        let allProducts = [];
        let activeCat = 'Semua';

        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                allProducts = await response.json();
                renderCategories();
                renderKatalog();
            } catch (error) { console.error("Gagal sinkron:", error); }
        }

        function renderCategories() {
            const container = document.getElementById('categoryList');
            const cats = ['Semua', ...new Set(allProducts.map(p => p.category))];
            container.innerHTML = cats.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm border transition-all whitespace-nowrap 
                    ${activeCat === cat ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-gray-600 border-gray-100'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderKatalog() {
            const grid = document.getElementById('productGrid');
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(term);
                const matchCat = activeCat === 'Semua' || p.category === activeCat;
                return matchSearch && matchCat;
            });

            grid.innerHTML = filtered.map(p => {
                const isEmpty = p.stock <= 0;
                const isLow = p.stock > 0 && p.stock < 10;
                let badgeStyle = isEmpty ? "bg-red-100 text-red-700" : (isLow ? "bg-yellow-100 text-yellow-700" : "bg-green-100 text-green-700");

                return `
                    <div class="bg-white p-4 rounded-[24px] shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                        <div>
                            <span class="text-[10px] font-black px-2 py-1 rounded-lg uppercase ${badgeStyle}">
                                ${isEmpty ? 'Habis' : p.category}
                            </span>
                            <h3 class="font-bold text-gray-800 mt-2 leading-tight">${p.name}</h3>
                            <p class="text-blue-600 font-extrabold text-lg mt-1">Rp ${Number(p.price_sell).toLocaleString('id-ID')}</p>
                            <p class="text-gray-400 text-[10px] italic">per ${p.unit}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t flex justify-between items-center">
                            <span class="text-[11px] font-bold text-gray-400 tracking-tighter uppercase">Stok: ${p.stock}</span>
                            <div class="w-12 bg-gray-100 h-1 rounded-full overflow-hidden">
                                <div class="h-full ${isEmpty ? 'bg-red-500' : (isLow ? 'bg-yellow-500' : 'bg-green-500')}" style="width: ${Math.min(p.stock * 10, 100)}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setCategory(cat) {
            activeCat = cat;
            renderCategories();
            renderKatalog();
        }

        fetchProducts();
        setInterval(fetchProducts, 5000);
    </script>
</body>
</html>

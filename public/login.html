<!doctype html>
<html lang="id">
  <head>
    <meta
      name="description"
      content="Kios Dua Putra - Sistem POS & Inventaris Modern untuk Kios Dua Putra Gorontalo. Kelola stok dan transaksi dengan efisiensi tinggi."
    />
    <meta name="author" content="Kios Dua Putra Team" />

    <meta property="og:title" content="Kios Dua Putra Admin | Dashboard" />
    <meta
      property="og:description"
      content="Manajemen kasir cerdas untuk Kios Dua Putra."
    />
    <meta property="og:type" content="website" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>"
    />

    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin | Kios Dua Putra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div
      class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm transform transition-all"
    >
      <div class="text-center mb-8">
        <div
          class="w-20 h-20 bg-blue-600 rounded-[2rem] flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-xl shadow-blue-500/20"
        >
          <i class="fas fa-user-shield"></i>
        </div>
        <h1 class="text-2xl font-black uppercase tracking-tighter">
          Admin Login
        </h1>
        <p class="text-slate-400 text-sm mt-1">Sistem Kelola Kios Dua Putra</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div class="relative">
          <i
            class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"
          ></i>
          <input
            type="text"
            id="user"
            placeholder="Username"
            class="w-full pl-12 pr-4 py-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            required
          />
        </div>
        <div class="relative">
          <i
            class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"
          ></i>
          <input
            type="password"
            id="pass"
            placeholder="Password"
            class="w-full pl-12 pr-4 py-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-blue-500/20 active:scale-95 transition-all hover:bg-blue-700"
        >
          MASUK SEKARANG
        </button>
      </form>

      <div
        id="errorMessage"
        class="hidden mt-4 p-3 bg-red-50 text-red-500 text-xs font-bold rounded-xl text-center border border-red-100"
      >
        Username atau Password salah!
      </div>
    </div>

    <script>
      // Redirect jika sudah login
      if (sessionStorage.getItem("isLoggedIn") === "true") {
        window.location.href = "admin.html";
      }

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const user = document.getElementById("user").value;
        const pass = document.getElementById("pass").value;

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass }),
          });
          const data = await res.json();

          if (data.success) {
            sessionStorage.setItem("isLoggedIn", "true");
            window.location.href = "admin.html";
          } else {
            const err = document.getElementById("errorMessage");
            err.classList.remove("hidden");
            setTimeout(() => err.classList.add("hidden"), 3000);
          }
        } catch (error) {
          console.error("Login Error:", error);
        }
      };
    </script>
  </body>
</html>
